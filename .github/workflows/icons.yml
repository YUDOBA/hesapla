name: icons
on:
  push:
    paths:
      - 'apple-touch-icon.b64'
      - '.github/workflows/icons.yml'
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: decode pngs
        run: |
          python3 - <<'PY'
          import base64, pathlib
          raw = pathlib.Path('apple-touch-icon.b64').read_text().strip()
          data = base64.b64decode(raw)
          pathlib.Path('apple-touch-icon.png').write_bytes(data)
          pathlib.Path('icon-192.png').write_bytes(data)
          pathlib.Path('icon-512.png').write_bytes(data)
          PY
      - name: commit pngs
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add apple-touch-icon.png icon-192.png icon-512.png
          git diff --staged --quiet || git commit -m "Add PNG home icons"
          git push
