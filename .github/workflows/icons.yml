name: icons
on:
  push:
    paths:
      - 'make_icon.py'
      - '.github/workflows/icons.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil fonts-dejavu-core
      - name: draw
        run: python3 make_icon.py
      - name: commit pngs
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add apple-touch-icon.png icon-192.png icon-512.png
          git diff --staged --quiet || git commit -m "Rebuild PNG home icons"
          git push
