<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#f4eee4"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="HESAPLA"/>
<title>HESAPLA</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" type="image/svg+xml" href="icon.svg"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=15"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=15"/>
<link rel="stylesheet" href="stylev2.css?v=15"/>
<style>
html,body,#app{background:#f4eee4;}
html,body,#app,.table,.half,.home,.result,.btn,.pas,.zar,.nick,.stats,.num{
  -webkit-user-select:none!important;user-select:none!important;
  -webkit-touch-callout:none!important;
}
input,textarea,select{-webkit-user-select:text!important;user-select:text!important;}
.home.splash,.home{
  background:
    radial-gradient(ellipse 90% 48% at 50% -8%,rgba(214,64,56,.55),transparent 58%),
    radial-gradient(ellipse 90% 48% at 50% 108%,rgba(28,86,190,.5),transparent 58%),
    linear-gradient(#f4e4c8,#ead6b0);
}
.home .brand{width:168px;height:168px;display:block;margin:4px auto 10px;border-radius:32px;box-shadow:0 6px 0 #1a2744,0 10px 16px rgba(0,0,0,.18);}
.home .yudoba-img{position:absolute;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:10px;}
.home .yudoba{display:none;}
.rules-home{margin-top:12px;max-width:320px;width:100%;padding:12px;font:inherit;letter-spacing:.14em;border:0;border-radius:10px;background:#c44a4a;color:#fffaf0;}
.stats.last{border-bottom:2px solid currentColor;padding-bottom:1px;}
.half.bot .stats.last{color:#1e4f8a;}
.half.top .stats.last{color:#9b2b2b;}
.half{overflow:visible;}
.half.bot{background:linear-gradient(#a9bbd4,#7e96b4)!important;}
.half.bot.on{background:linear-gradient(#cfe8ff,#2f8cff)!important;}
.half.top{background:linear-gradient(#d4a8a5,#b87874)!important;}
.half.top.on{background:linear-gradient(#ffd2cc,#ff5a4e)!important;}
.pas{display:none!important;}
.actions{align-items:center;padding-bottom:calc(10px + env(safe-area-inset-bottom));}
.half.bot .actions{padding-bottom:calc(18px + env(safe-area-inset-bottom));}
.actions .zar{flex:2.2;min-height:44px;}
.clock{min-width:36px;text-align:center;font-size:20px;font-weight:700;}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;position:relative;min-height:44px;}
.hud .nick{justify-self:start;}
.hud .stats{justify-self:end;}
.hud>.jhud,.hud>.jbtn{display:none!important;}
.midkit{display:flex;align-items:center;justify-content:center;gap:6px;justify-self:center;position:relative;z-index:8;}
.jbtn{width:36px;height:36px;margin:0;border:0;border-radius:9px;font:inherit;font-weight:700;background:#1a2744;color:#f7f1e6;}
.jbtn.on{background:#c9a227;color:#2a2208;}
.jbtn.off{opacity:.35;}
.jhud.slots{display:flex;gap:4px;align-items:center;min-width:62px;min-height:29px;}
.mdie{width:29px;height:29px;border-radius:5px;background:#fffdf8;border:1px solid #1a2744;display:grid;place-items:center;flex:0 0 29px;}
.mdie.slot{visibility:hidden;pointer-events:none;border-color:transparent;background:transparent;}
.mdie.pickable,.mdie.owned{cursor:pointer;}
.mdie.on{background:#f0d36a;}
.mpips{display:grid;grid-template-columns:repeat(3,5px);grid-template-rows:repeat(3,5px);gap:1px;}
.mpip{background:#1a2744;border-radius:50%;}
.jpick-float{
  position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);
  display:flex;gap:4px;z-index:20;padding:5px 7px;border-radius:8px;
  background:rgba(247,241,230,.94);box-shadow:0 3px 10px rgba(0,0,0,.22);
}
.half>.turn-dot{display:none!important;}
.midkit .turn-dot .dfill{position:absolute;inset:0;border-radius:50%;background:rgba(0,40,0,.28);transform:scaleX(0);transform-origin:left center;pointer-events:none;}
.midkit .turn-dot.holding .dfill{transform:scaleX(1);transition:transform .5s linear;}
.midkit .turn-dot{
  position:relative;top:auto;left:auto;right:auto;transform:none;
  width:29px;height:29px;flex:0 0 29px;
  border-radius:50%;pointer-events:auto;z-index:6;
  background:radial-gradient(circle at 32% 28%,#d8ffb8 0%,#3dcc44 52%,#157a22 100%);
  box-shadow:inset 2px 3px 5px rgba(255,255,255,.6),inset -3px -4px 6px rgba(0,40,0,.35),0 3px 7px rgba(0,30,0,.28);
}
.pes-rail{position:absolute;left:0;top:16%;bottom:22%;width:80px;z-index:9;}
.pes-line{position:absolute;left:0;top:0;bottom:0;width:12px;background:currentColor;opacity:.7;border-radius:0 4px 4px 0;}
.half.bot .pes-line{color:#1e4f8a;}
.half.top .pes-line{color:#9b2b2b;}
.pes-btn,.pes-rules{
  position:absolute;left:-88px;width:64px;padding:10px 0;border:0;font:inherit;font-size:11px;letter-spacing:.1em;font-weight:700;
  color:#f7f1e6;transition:left .18s ease;z-index:10;
}
.pes-btn{top:28%;border-radius:0 10px 0 0;background:#222;}
.pes-rules{top:58%;border-radius:0 0 10px 0;background:#3a4a62;}
.pes-rail.open .pes-btn,.pes-rail.open .pes-rules{left:12px;}
.pes-ask{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);background:#fffaf0;border-radius:12px;padding:14px;text-align:center;z-index:20;}
.pes-ask p{margin:0 0 10px;font-weight:700;}
.pes-ask button{margin:0 4px;padding:8px 14px;font:inherit;border:0;border-radius:8px;}
.pes-ok{background:#1a2744;color:#f7f1e6;}
.pes-no{background:#ddd4c4;}
.score{height:100%;height:100dvh;display:flex;flex-direction:column;position:relative;}
.score-half{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;}
.score-half.top{background:linear-gradient(#ffd2cc,#ff5a4e);transform:rotate(180deg);}
.score-half.bot{background:linear-gradient(#cfe8ff,#2f8cff);}
.score-card{width:min(320px,88%);background:#fff6e6;border-radius:14px;padding:16px 14px;box-shadow:0 4px 0 #1a2744;text-align:center;}
.score-card h2{margin:0 0 12px;font-size:18px;letter-spacing:.04em;}
.score-me,.score-op{display:flex;justify-content:space-between;gap:8px;padding:8px 4px;font-size:14px;}
.score-me{font-weight:700;border-bottom:1px solid rgba(26,39,68,.15);}
.score-go{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;font:inherit;font-weight:700;background:#1a2744;color:#f7f1e6;}
.score .ver{position:absolute;left:12px;bottom:8px;font-size:12px;}
.result{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(ellipse 90% 46% at 50% -10%,rgba(214,64,56,.5),transparent 56%),
    radial-gradient(ellipse 90% 46% at 50% 110%,rgba(28,86,190,.48),transparent 56%),
    linear-gradient(#f4e4c8,#ead6b0);
}
.rules{
  height:100%;height:100dvh;position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse 90% 46% at 50% -10%,rgba(214,64,56,.5),transparent 56%),
    radial-gradient(ellipse 90% 46% at 50% 110%,rgba(28,86,190,.48),transparent 56%),
    linear-gradient(#f4e4c8,#ead6b0);
}
.rules.flip{transform:rotate(180deg);}
.rules-back{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:5;padding:8px 14px;border:0;border-radius:8px;font:inherit;background:#1a2744;color:#f7f1e6;}
.rules-scroll{height:100%;overflow:auto;padding:52px 18px 28px;}
.rules-scroll h1{margin:0 0 14px;letter-spacing:.16em;font-size:22px;}
.rules-scroll article{background:#fff6e6;border-radius:10px;padding:10px 12px;margin:0 0 10px;box-shadow:0 2px 0 #1a2744;}
.rules-scroll h3{margin:0 0 6px;font-size:14px;}
.rules-scroll p{margin:0 0 6px;font-size:13px;line-height:1.35;}
.rules-scroll .warn{color:#9b2b2b;font-size:12px;}
</style>
</head>
<body>
<div id="app"></div>
<script src="gamev5.js?v=15"></script>
<script src="v4d.js?v=15"></script>
<script src="v4f.js?v=15"></script>
<script src="rulesv.js?v=15"></script>
<script src="v11.js?v=15"></script>
<script src="v12.js?v=15"></script>
<script src="v15.js?v=15"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    return Promise.all(regs.map(function (r) { return r.unregister(); }));
  }).then(function () {
    return navigator.serviceWorker.register('./sw-v12.js');
  });
}
</script>
</body>
</html>
